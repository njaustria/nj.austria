<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description"
        content="Personal portfolio of a product-minded developer crafting thoughtful digital experiences.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <title>Neian Austria | Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page-shell">
        <aside class="sidebar d-none d-lg-flex">
            <div class="sidebar-inner">
                <a class="brand" href="#home">
                    <span>Neian Austria</span>
                </a>
                <nav class="sidebar-nav" aria-label="Sidebar navigation">
                    <a href="#about">About</a>
                    <a href="#experience">Education</a>
                    <a href="#skills">Skills</a>
                    <a href="#projects">Projects</a>
                    <a href="#certifications">Certifications</a>
                </nav>
                <div class="sidebar-footer">
                    <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
                        <i class="bi bi-moon-stars"></i>
                    </button>
                    <div class="social-links">
                        <a href="https://github.com/njaustria" target="_blank" rel="noreferrer" aria-label="GitHub"><i
                                class="bi bi-github"></i></a>
                        <a href="https://www.linkedin.com/in/njaustria" target="_blank" rel="noreferrer"
                            aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
                        <a href="mailto:neianaustria07@gmail.com" aria-label="Email"><i class="bi bi-envelope"></i></a>
                    </div>
                </div>
            </div>
        </aside>

        <main id="main-content">
            <header class="topbar d-lg-none">
                <a class="brand" href="#home">
                    <span class="brand-mark"></span>
                    <span>Neian Austria</span>
                </a>
                <button class="menu-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu"
                    aria-controls="mobileMenu" aria-label="Open navigation">
                    <i class="bi bi-list"></i>
                </button>
            </header>

            <section id="home" class="hero section-block reveal">
                <div class="hero-copy">
                    <p class="eyebrow">Developer • Designer • Builder</p>
                    <h1>I craft elegant digital products with clarity, performance, and intention.</h1>
                    <p class="hero-subtitle">
                        I’m a <span class="typed-text"
                            data-typed='["Fourth Year", "BSIT Student", "Soon to be Full-Stack Developer"]'></span>
                    </p>
                    <div class="hero-actions">
                        <a class="btn btn-dark btn-lg" href="#projects">View projects</a>
                    </div>
                    <div class="hero-stats">
                        <div>
                            <strong data-counter="4">0</strong>
                            <span>Years building</span>
                        </div>
                        <div>
                            <strong data-counter="5">0</strong>
                            <span>Systems Build</span>
                        </div>
                        <div>
                            <strong data-counter="3">0</strong>
                            <span>Websites Build</span>
                        </div>
                    </div>
                </div>

                <div class="hero-visual">
                    <div class="portrait-card">
                        <img src="" alt="Picture of Neian Austria">
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
